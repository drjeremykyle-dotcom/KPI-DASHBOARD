<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovation KPI 2.0 — Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;0,900;1,300&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
 :root {
 --bg: #0a0c0f;
 --surface: #111318;
 --surface2: #181c23;
 --border: #1f2530;
 --accent: #c8f04a;
 --accent2: #4af0c8;
 --accent3: #f04a7a;
 --text: #e8eaf0;
 --muted2: #8a909f;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
 background: var(--bg);
 color: var(--text);
 font-family: 'Syne', sans-serif;
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 overflow: hidden;
 }

 body::before {
 content: '';
 position: fixed;
 inset: 0;
 background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
 pointer-events: none;
 z-index: 0;
 opacity: 0.4;
 }

 .container {
 position: relative;
 z-index: 1;
 max-width: 600px;
 width: 90%;
 }

 .launcher-card {
 background: linear-gradient(135deg, #111318 0%, #181c23 100%);
 border: 1px solid var(--border);
 border-radius: 24px;
 padding: 60px 40px;
 text-align: center;
 box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
 }

 .logo {
 font-size: 64px;
 margin-bottom: 24px;
 animation: pulse-logo 2s ease-in-out infinite;
 }

 @keyframes pulse-logo {
 0%, 100% { transform: scale(1); opacity: 1; }
 50% { transform: scale(1.05); opacity: 0.8; }
 }

 .eyebrow {
 font-family: 'DM Mono', monospace;
 font-size: 11px;
 color: var(--accent);
 letter-spacing: 3px;
 text-transform: uppercase;
 margin-bottom: 16px;
 }

 h1 {
 font-family: 'Fraunces', serif;
 font-size: 48px;
 font-weight: 900;
 line-height: 1.1;
 letter-spacing: -1px;
 margin-bottom: 12px;
 }

 h1 em {
 font-style: italic;
 color: var(--accent);
 }

 .subtitle {
 font-family: 'DM Mono', monospace;
 font-size: 13px;
 color: var(--muted2);
 margin-bottom: 40px;
 line-height: 1.6;
 }

 .stats {
 display: grid;
 grid-template-columns: 1fr 1fr 1fr;
 gap: 16px;
 margin-bottom: 40px;
 }

 .stat {
 background: var(--surface);
 border: 1px solid var(--border);
 border-radius: 12px;
 padding: 16px;
 }

 .stat-number {
 font-family: 'Fraunces', serif;
 font-size: 24px;
 font-weight: 900;
 color: var(--accent);
 margin-bottom: 4px;
 }

 .stat-label {
 font-family: 'DM Mono', monospace;
 font-size: 10px;
 color: var(--muted2);
 letter-spacing: 1px;
 text-transform: uppercase;
 }

 .launch-button {
 background: var(--accent);
 color: #0a0c0f;
 border: none;
 border-radius: 12px;
 padding: 18px 48px;
 font-size: 16px;
 font-weight: 800;
 letter-spacing: 1px;
 text-transform: uppercase;
 cursor: pointer;
 font-family: 'Syne', sans-serif;
 transition: all 0.3s ease;
 position: relative;
 overflow: hidden;
 margin-bottom: 20px;
 }

 .launch-button::before {
 content: '';
 position: absolute;
 top: 0;
 left: -100%;
 width: 100%;
 height: 100%;
 background: rgba(255, 255, 255, 0.2);
 transition: left 0.3s ease;
 }

 .launch-button:hover {
 transform: translateY(-2px);
 box-shadow: 0 12px 24px rgba(200, 240, 74, 0.3);
 }

 .launch-button:hover::before {
 left: 100%;
 }

 .launch-button:active {
 transform: translateY(0);
 }

 .alternatives {
 display: flex;
 gap: 12px;
 margin-bottom: 24px;
 }

 .alt-button {
 flex: 1;
 background: var(--surface);
 color: var(--text);
 border: 1px solid var(--border);
 border-radius: 8px;
 padding: 12px 16px;
 font-size: 12px;
 font-weight: 700;
 cursor: pointer;
 transition: all 0.2s;
 font-family: 'Syne', sans-serif;
 }

 .alt-button:hover {
 background: var(--surface2);
 border-color: var(--accent);
 color: var(--accent);
 }

 .footer {
 font-family: 'DM Mono', monospace;
 font-size: 11px;
 color: var(--muted2);
 margin-top: 24px;
 padding-top: 24px;
 border-top: 1px solid var(--border);
 }

 .status {
 display: inline-block;
 width: 8px;
 height: 8px;
 background: var(--accent);
 border-radius: 50%;
 margin-right: 6px;
 animation: pulse 2s infinite;
 }

 @keyframes pulse {
 0%, 100% { opacity: 1; }
 50% { opacity: 0.3; }
 }

 .loading {
 display: none;
 text-align: center;
 padding: 40px 0;
 }

 .spinner {
 display: inline-block;
 width: 40px;
 height: 40px;
 border: 3px solid var(--border);
 border-top-color: var(--accent);
 border-radius: 50%;
 animation: spin 1s linear infinite;
 margin-bottom: 20px;
 }

 @keyframes spin {
 to { transform: rotate(360deg); }
 }

 .loading-text {
 font-family: 'DM Mono', monospace;
 font-size: 13px;
 color: var(--muted2);
 }

 @media (max-width: 600px) {
 .launcher-card {
 padding: 40px 24px;
 }

 h1 {
 font-size: 36px;
 }

 .stats {
 grid-template-columns: 1fr;
 }

 .alternatives {
 flex-direction: column;
 }
 }
</style>
</head>
<body>

<div class="container">
 <div class="launcher-card">
 <div class="logo">📊</div>
 
 <div class="eyebrow">Intelligence Dashboard</div>
 <h1>Renovation<br><em>KPI</em> 2.0</h1>
 
 <div class="subtitle">
 32 months of data | 22 projects | 847 units<br>
 $4.8M+ value demonstrated
 </div>

 <div class="stats">
 <div class="stat">
 <div class="stat-number">847</div>
 <div class="stat-label">Units</div>
 </div>
 <div class="stat">
 <div class="stat-number">32mo</div>
 <div class="stat-label">Data</div>
 </div>
 <div class="stat">
 <div class="stat-number">$4.8M</div>
 <div class="stat-label">Value</div>
 </div>
 </div>

 <button class="launch-button" onclick="launchDashboard()">
 → Launch Dashboard
 </button>

 <div class="alternatives">
 <button class="alt-button" onclick="openFile('RENOVATION_KPI_2.0.html')">
 📈 Main Dashboard
 </button>
 <button class="alt-button" onclick="openFile('START_HERE.md')">
 📖 Getting Started
 </button>
 <button class="alt-button" onclick="openFile('README_KPI_2.0_COMPLETE.md')">
 📋 Documentation
 </button>
 </div>

 <div class="loading" id="loading">
 <div class="spinner"></div>
 <div class="loading-text">Launching dashboard...</div>
 </div>

 <div class="footer">
 <span class="status"></span>Live System Ready
 <br><br>
 8 Tabs • 4 Charts • 22 Projects • 5 Scenarios
 <br>
 Updated: May 17, 2026 | Status: Production Ready
 </div>
 </div>
</div>

<script>
function launchDashboard() {
 const button = document.querySelector('.launch-button');
 const loading = document.getElementById('loading');
 
 button.style.display = 'none';
 loading.style.display = 'block';
 
 // Simulate brief loading
 setTimeout(() => {
 window.location.href = 'RENOVATION_KPI_2.0.html';
 }, 300);
}

function openFile(filename) {
 const loading = document.getElementById('loading');
 loading.style.display = 'block';
 
 // Simulate brief loading
 setTimeout(() => {
 if (filename.endsWith('.md')) {
 // For markdown files, try to open in browser or download
 fetch(filename)
 .then(r => r.text())
 .then(text => {
 const blob = new Blob([text], { type: 'text/markdown' });
 const url = URL.createObjectURL(blob);
 window.open(url, '_blank');
 loading.style.display = 'none';
 })
 .catch(() => {
 alert('Could not open file. Try downloading it directly.');
 loading.style.display = 'none';
 });
 } else {
 window.location.href = filename;
 }
 }, 300);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
 if (e.key === 'Enter') {
 launchDashboard();
 }
});
</script>

</body>
</html>
